[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-auto-evolve"
version = "0.1.0"
description = "Evaluation-driven evolution of robot agent scaffolds"
requires-python = ">=3.10"
dependencies = [
  "msgpack>=1.0.8",
  "numpy>=1.22.4",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
robot-auto-evolve = "robot_auto_evolve.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
